<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro — BodySport</title>
  <meta name="description" content="Crie sua conta para acessar o painel da BodySport." />
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/cadastro.css') }}">
</head>

<body>
  <main class="pagina-cadastro">
    <!-- Cabeçalho do topo -->
    <header class="cabecalho-cadastro">
      <section class="marca">
        <span class="logo">BS</span>
        <article>
          <h1>BodySport</h1>
          <p class="subtitulo">Painel de Clientes — Cadastro</p>
        </article>
      </section>

      <nav aria-label="Navegação principal">
        <ul>
          <li><a href="{{ url_for('home') }}">Início</a></li>
          <li><a href="{{ url_for('login_page') }}">Entrar</a></li>
        </ul>
      </nav>
    </header>

    <!-- Conteúdo principal -->
    <section class="cartao formulario" aria-labelledby="titulo-cadastro">
      <header>
        <h2 id="titulo-cadastro">Criar nova conta</h2>
        <p class="descricao">Preencha os campos abaixo para se cadastrar na plataforma BodySport.</p>
      </header>

      <!-- Formulário de cadastro -->
      <form id="formularioCadastro" novalidate>
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required>

        <label for="senha">Senha</label>
        <section class="campo-senha">
          <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
          <button type="button" id="mostrarSenha" aria-label="Mostrar ou ocultar senha">Mostrar</button>
        </section>

        <label for="confirmar">Confirmar senha</label>
        <section class="campo-senha">
          <input type="password" id="confirmar" name="confirmar" placeholder="Repita sua senha" required>
        </section>

        <button type="submit" class="botao botao-primario">Cadastrar</button>
      </form>

      <footer class="rodape-formulario">
        <p>Já tem conta?
          <a href="{{ url_for('login_page') }}" class="link">Entrar</a>
        </p>
      </footer>
    </section>

    <!-- Mensagem flutuante de feedback -->
    <section id="mensagem" class="mensagem info" role="status" aria-live="polite"></section>
  </main>

  <footer class="rodape-site">
    <p>© 2025 BodySport — Todos os direitos reservados.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/cadastro.js') }}"></script>
</body>
</html>
