<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — BodySport</title>
  <meta name="description" content="Crie sua conta na BodySport para acessar o painel de clientes.">
  <link rel="icon" href="{{ url_for('static', filename='assets/race-car-black-and-white-vector.ico') }}"> 
  
  <!-- Estilos principais -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/cadastro.css') }}">
</head>

<body>
  <main class="pagina-cadastro">

    <header class="cabecalho-cadastro">
      <section class="marca">
        <span class="logo">BS</span>
        <article>
          <h1>BodySport</h1>
          <p class="subtitulo">Painel de Clientes — Cadastro</p>
        </article>
      </section>

      <nav aria-label="Navegação principal">
        <ul>
          <li><a href="{{ url_for('home') }}">Início</a></li>
          <li><a href="{{ url_for('login_page') }}">Entrar</a></li>
        </ul>
      </nav>
    </header>

    <section class="formulario" aria-labelledby="titulo-cadastro">
      <h2 id="titulo-cadastro">Criar nova conta</h2>
      <p class="descricao">Preencha os campos abaixo para se cadastrar na plataforma BodySport.</p>

      <form id="formCadastro" novalidate>
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com" required>

        <label for="senha">Senha</label>
        <section class="campo-senha">
          <input type="password" id="senha" name="senha" placeholder="Crie uma senha segura" required>
          <button type="button" id="mostrarSenha" aria-label="Mostrar senha">Mostrar</button>
        </section>

        <button type="submit" class="botao botao-primario">Cadastrar</button>
      </form>

      <footer class="rodape-formulario">
        <p>Já tem conta?
          <a href="{{ url_for('login_page') }}" class="link">Entrar</a>
        </p>
      </footer>
    </section>

    <section id="msg" class="mensagem info" role="status" aria-live="polite"></section>
  </main>

  <footer class="rodape-site">
    <p>© 2025 BodySport — Todos os direitos reservados.</p>
  </footer>

  <!-- Script externo -->
  <script src="{{ url_for('static', filename='js/cadastro.js') }}"></script>
</body>
</html>
